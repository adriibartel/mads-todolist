name: Developer tests

on: [push, pull_request]

jobs:
  launch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Launch tests with Maven
        run: ./mvnw --batch-mode test