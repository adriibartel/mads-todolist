name: Integration tests

on: [push, pull_request]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    container: amazoncorretto:8-alpine-jdk
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: mads
          POSTGRES_PASSWORD: mads
          POSTGRES_DB: mads_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Launch integration tests with Maven
        run: ./mvnw --batch-mode -Dspring.profiles.active=postgres test
        env:
          POSTGRES_HOST: postgres
