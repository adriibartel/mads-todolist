<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Equipos')"></head>
<body>
<nav th:replace="navBar :: navbar(${usuario != null ? usuario.id : null}, ${usuario != null ? usuario.nombre : null})"></nav>
<div class="container-fluid">
    <h1 class="mt-3">Equipos</h1>
    <form class="form-inline mb-3" th:if="${usuario != null}" method="post" th:action="@{/equipos}">
        <label class="sr-only" for="nombreEquipo">Nombre del equipo</label>
        <input class="form-control mr-2" id="nombreEquipo" name="nombre" placeholder="Nombre del equipo" required>
        <button class="btn btn-primary" type="submit">Crear equipo</button>
    </form>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Identificador</th>
            <th>Nombre</th>
            <th th:if="${usuario != null}">Pertenencia</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="equipo : ${equipos}">
            <td th:text="${equipo.id}"></td>
            <td><a th:href="@{/equipos/{id}(id=${equipo.id})}" th:text="${equipo.nombre}"></a></td>
            <td th:if="${usuario != null}">
                <form th:if="${equiposUsuario.contains(equipo)}" method="post"
                      th:action="@{/equipos/{id}/usuarios/salir(id=${equipo.id})}">
                    <button class="btn btn-outline-danger btn-sm" type="submit">Abandonar</button>
                </form>
                <form th:unless="${equiposUsuario.contains(equipo)}" method="post"
                      th:action="@{/equipos/{id}/usuarios(id=${equipo.id})}">
                    <button class="btn btn-outline-primary btn-sm" type="submit">Unirme</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="fragments::javascript"></div>
</body>
</html>
