<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Equipos')"></head>
<body>
<nav th:replace="navBar :: navbar(${usuario != null ? usuario.id : null}, ${usuario != null ? usuario.nombre : null})"></nav>
<div class="container-fluid">
    <h1 class="mt-3">Equipos</h1>
    <form method="post" th:action="@{/equipos}" class="form-inline mb-3">
        <label for="nombreEquipo" class="mr-2">Nombre del equipo</label>
        <input id="nombreEquipo" name="nombre" class="form-control mr-2" required/>
        <button type="submit" class="btn btn-primary">Crear equipo</button>
    </form>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Equipo</th>
            <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="equipo : ${equipos}">
            <td><a th:href="@{/equipos/{id}/usuarios(id=${equipo.id})}" th:text="${equipo.nombre}"></a></td>
            <td>
                <form th:if="${#lists.contains(equiposUsuario, equipo)}" method="post"
                      th:action="@{/equipos/{id}/miembros/salir(id=${equipo.id})}">
                    <button type="submit" class="btn btn-warning">Abandonar</button>
                </form>
                <form th:unless="${#lists.contains(equiposUsuario, equipo)}" method="post"
                      th:action="@{/equipos/{id}/miembros(id=${equipo.id})}">
                    <button type="submit" class="btn btn-success">Unirme</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="fragments::javascript"></div>
</body>
</html>
