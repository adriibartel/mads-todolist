<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light" th:fragment="navbar(usuarioId, usuarioNombre)">
  <a class="navbar-brand" th:href="@{/about}">ToDoList</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir navegación">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav">
      <li class="nav-item" th:if="${usuarioId != null}">
        <a class="nav-link" th:href="@{/usuarios/{id}/tareas(id=${usuarioId})}">Tareas</a>
      </li>
      <li class="nav-item" th:if="${usuarioId != null}">
        <a class="nav-link" th:href="@{/usuarios/{id}/tareas/nueva(id=${usuarioId})}">Nueva tarea</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/about}">Acerca de</a>
      </li>
      <li class="nav-item" th:if="${usuarioId != null}">
        <a class="nav-link" th:href="@{/logout}">Salir</a>
      </li>
      <li class="nav-item" th:unless="${usuarioId != null}">
        <a class="nav-link" th:href="@{/login}">Iniciar sesión</a>
      </li>

      <li class="nav-item" th:unless="${usuarioId != null}">
        <a class="nav-link" th:href="@{/registro}">Registrarse</a>
      </li>
    </ul>
    <ul class="navbar-nav ml-auto" th:if="${usuarioId != null}">
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown"
           aria-haspopup="true" aria-expanded="false">
          <span th:text="${usuarioNombre}"></span>
        </a>
        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdown">
          <a class="dropdown-item" href="#">Cuenta</a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" th:href="@{/logout}">Cerrar sesión</a>
        </div>
      </li>
    </ul>
  </div>
</nav>
</body>
</html>
